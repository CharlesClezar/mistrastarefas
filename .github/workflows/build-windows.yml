name: Gerar EXE para Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Node.js no computador da nuvem
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install

      - name: Criar o aplicativo EXE
        run: npm run dist:win

      - name: Disponibilizar o EXE para baixar
        uses: actions/upload-artifact@v4
        with:
          name: Minhas-Tarefas-Windows
          path: release/*.exe
          if-no-files-found: error
          retention-days: 14
